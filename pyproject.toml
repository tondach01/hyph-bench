[project]
name = "pat-gen-opt"
version = "1.0.0"
description = "Gaussian-process optimization of patgen hyperparameters for hyphenation patterns"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "matplotlib>=3.10.8",
    "optuna>=4.8.0",
    "regex>=2023.0.0",
]

[tool.basedpyright]
typeCheckingMode = "basic"
